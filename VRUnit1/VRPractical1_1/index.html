<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-box position="-1 .75 -3" rotation="0 0 0" width="4" depth="3" height=".25" color="#4CC3D9"></a-box>

      <a-box position= "0 0 0">
      <a-torus position="1 .5 -2" rotation="0 0 0" radius=".5" radius-tubular=".05" color="#000000"></a-torus>
      <a-torus position="1 .5 -4" rotation="0 0 0" radius=".5" radius-tubular=".05" color="#000000"></a-torus>
      <a-torus position="-3 .5 -2" rotation="0 0 0" radius=".5" radius-tubular=".05" color="#000000"></a-torus>
      <a-torus position="-3 .5 -4" rotation="0 0 0" radius=".5" radius-tubular=".05" color="#000000"></a-torus>
      </a-box>

      <a-plane position="0 0 -4" rotation="-90 0 0" width="25" height="25" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
      <a-camera position="0 1.4 5"></a-camera>
    </a-scene>
  </body>
</html>
