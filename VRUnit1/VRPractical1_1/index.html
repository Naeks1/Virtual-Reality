<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-box position="-1 .8 -3" width="4" depth="3" height=".75" color="#4CC3D9"></a-box>
      <a-box position="-4.9 1.15 -3" width="1" depth="3" height="1.4" color="#4CC3D9"></a-box>
      <a-box position="3.4 1.15 -3" width="2" depth="3" height="1.4" color="#4CC3D9"></a-box>
      <a-box position="1.7 1.1 -3" width="2" depth="3" height=".15" color="#4CC3D9"></a-box>
      <a-box position="-3.7 1.1 -3" width="2" depth="3" height=".15" color="#4CC3D9"></a-box>
      <a-box position="-1 2 -3" width="6.8" depth="3" height="2" color="#4CC3D9"></a-box>
    
      <a-box position= "0 0 0">
      <a-torus position="1.7 .5 -1.6" rotation="0 0 0" radius=".5" radius-tubular=".05" color="#000000"></a-torus>
      <a-torus position="1.7 .5 -4.4" rotation="0 0 0" radius=".5" radius-tubular=".05" color="#000000"></a-torus>
      <a-torus position="-3.7 .5 -1.6" rotation="0 0 0" radius=".5" radius-tubular=".05" color="#000000"></a-torus>
      <a-torus position="-3.7 .5 -4.4" rotation="0 0 0" radius=".5" radius-tubular=".05" color="#000000"></a-torus>
      <a-cylinder position="-3.7 .5 -4.4" rotation="90 0 0" radius=".5" height=".1"></a-cylinder>
      <a-cylinder position="-3.7 .5 -1.6" rotation="90 0 0" radius=".5" height=".1"></a-cylinder>
      <a-cylinder position="1.7 .5 -4.4" rotation="90 0 0" radius=".5" height=".1"></a-cylinder>
      <a-cylinder position="1.7 .5 -1.6" rotation="90 0 0" radius=".5" height=".1"></a-cylinder>
      </a-box>

      <a-plane position="0 0 -4" rotation="-90 0 0" width="25" height="25" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
      <a-camera position="0 1.4 5"></a-camera>
    </a-scene>
  </body>
</html>
