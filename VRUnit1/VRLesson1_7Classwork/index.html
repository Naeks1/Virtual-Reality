<html>
  <head>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img id="texture" src="pacman_maze.jpg" />
      </a-assets>

      <a-sphere position="0 3 0 " color="white"></a-sphere>
      <a-cylinder position="0 2 0" height="1.8" color="white"></a-cylinder>
      <a-triangle scale=".4 .4 .4" position=".8 .9 0" side="double" rotation="0 90 180"></a-triangle>


      <a-plane position="0 0 -4" rotation="-90 0 0" width="20" height="20" repeat="5 5" src="#texture"></a-plane>
      <a-sky color="black"></a-sky>
    </a-scene>
  </body>
</html>
